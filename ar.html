<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Growing tree · marker mode</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div id="container"></div>

<div id="hud">
  <span id="count">0</span>
  <span id="count-label">scans</span>
</div>
<div id="status"></div>

<div id="gate">
  <h1 class="mark">A tree that <em>grows</em> when you look</h1>
  <p>Point your camera at the target image. The tree grows out of it. Tap the envelope on a branch to read what is inside.</p>
  <button class="primary" id="begin">Allow camera and begin</button>
</div>

<div id="letter-scrim">
  <div id="letter">
    <div class="crease"></div>
    <h2 id="letter-title"></h2>
    <div class="body" id="letter-body"></div>
    <div class="sign" id="letter-from"></div>
    <button id="letter-close">Fold it back</button>
  </div>
</div>

<div id="dev">
  <label id="dev-read">0 scans</label>
  <input type="range" id="dev-slider" min="0" max="400" value="0">
  <div class="row">
    <button id="dev-reset">Reset to seed</button>
    <button id="dev-close">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { buildTree, buildEnvelope, buildBird, flyBird, addLights, disposeTree } from './js/scene.js';
import { getScans, addScan, growthT, getBird, grantBird } from './js/growth.js';
import * as ui from './js/ui.js';

// The image the tree grows from. This default is MindAR's sample target so
// you can test in two minutes: open js/README or the repo README for the link
// to the matching image, or compile your own QR code at
// https://hiukim.github.io/mind-ar-js-doc/tools/compile
const TARGET_SRC = new URLSearchParams(location.search).get('target')
  || 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind';

let mindar, anchor, scene, camera, renderer;
let tree = null, envelope = null, bird = null;
let scans = 0, treeHeight = 0.4, found = false;
const clock = new THREE.Clock();

function rebuild(n) {
  if (tree) { anchor.group.remove(tree.group); disposeTree(tree); }
  const built = buildTree(n);
  tree = built;
  treeHeight = built.height;
  anchor.group.add(built.group);

  if (envelope) anchor.group.remove(envelope);
  envelope = buildEnvelope();
  envelope.position.copy(built.envelopeAnchor);
  envelope.position.z += 0.02;
  anchor.group.add(envelope);
}

function spawnBird(variant) {
  if (bird) anchor.group.remove(bird);
  bird = buildBird(variant);
  anchor.group.add(bird);
}

async function begin() {
  document.getElementById('gate').classList.add('hidden');
  ui.status('Looking for the target…');

  mindar = new MindARThree({
    container: document.querySelector('#container'),
    imageTargetSrc: TARGET_SRC,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
  });

  ({ renderer, scene, camera } = mindar);
  addLights(scene);
  anchor = mindar.addAnchor(0);

  // Lay the tree down on the target so it stands up out of the paper.
  anchor.group.rotation.x = -Math.PI / 2;

  scans = await addScan();
  ui.renderCount(scans);
  rebuild(scans);

  const existing = getBird();
  if (existing) spawnBird(existing.variant);

  anchor.onTargetFound = () => {
    found = true;
    ui.status(existing || bird ? 'Your bird is here.' : 'Tap the envelope.', true);
  };
  anchor.onTargetLost = () => {
    found = false;
    ui.status('Point back at the target.');
  };

  try {
    await mindar.start();
  } catch (e) {
    ui.status('Camera blocked. Check browser permissions and reload.');
    return;
  }

  const camWorld = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    if (envelope) {
      camera.getWorldPosition(camWorld);
      envelope.lookAt(camWorld);
      const r = envelope.userData.ring;
      const p = 0.28 + Math.sin(t * 2.1) * 0.16;
      r.material.opacity = bird ? 0 : p;
      r.scale.setScalar(1 + Math.sin(t * 2.1) * 0.06);
    }
    if (bird) flyBird(bird, t, treeHeight, 'orbit');
    renderer.render(scene, camera);
  });
}

/* ---------- tapping the envelope ---------- */

const ray = new THREE.Raycaster();
const pt = new THREE.Vector2();

function onTap(ev) {
  if (!found || !envelope || bird || ui.isLetterOpen()) return;
  const touch = ev.changedTouches ? ev.changedTouches[0] : ev;
  pt.x = (touch.clientX / window.innerWidth) * 2 - 1;
  pt.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(pt, camera);
  const hits = ray.intersectObject(envelope.userData.hit, true);
  if (!hits.length) return;

  ui.openLetter(ui.letterFor(scans), () => {
    const variant = scans % 4;
    grantBird(variant);
    spawnBird(variant);
    ui.renderCount(scans);
    ui.status(`A ${ui.birdName(variant)} follows you now. 24 hours.`, true);
  });
}

document.addEventListener('touchend', onTap, { passive: true });
document.addEventListener('click', onTap);

document.getElementById('letter-close').addEventListener('click', ui.closeLetter);
document.getElementById('begin').addEventListener('click', begin, { once: true });

ui.initDev((n) => { scans = n; if (anchor) rebuild(n); });
getScans().then(ui.renderCount);
</script>
</body>
</html>
