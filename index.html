<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Growing tree · AR</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<video id="feed" playsinline muted autoplay></video>
<div id="stage"></div>

<div id="hud">
  <span id="count">0</span>
  <span id="count-label">scans</span>
  <button id="move-btn" hidden>Move tree</button>
</div>
<div id="status"></div>

<!-- placement / adjust controls -->
<div id="place-hint" hidden>Tap where the tree should stand</div>
<div id="adjust-bar" hidden>
  <span class="adjust-tip">Pinch to resize · drag with two fingers to move</span>
  <button class="primary" id="lock-btn">Lock in place</button>
</div>

<div id="gate">
  <h1 class="mark">A tree that <em>grows</em> when you look</h1>
  <p>Set the tree down in the room in front of you, size it with a pinch, and lock it in place. A bird will keep you company.</p>
  <button class="primary" id="begin">Allow camera and begin</button>
</div>

<div id="letter-scrim">
  <div id="letter">
    <div class="crease"></div>
    <h2 id="letter-title"></h2>
    <div class="body" id="letter-body"></div>
    <div class="sign" id="letter-from"></div>
    <button id="letter-close">Fold it back</button>
  </div>
</div>

<div id="dev">
  <label id="dev-read">0 scans</label>
  <input type="range" id="dev-slider" min="0" max="400" value="0">
  <div class="row">
    <button id="dev-reset">Reset to seed</button>
    <button id="dev-close">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { buildTree, buildEnvelope, buildBird, addLights, disposeTree } from './js/scene.js';
import { getScans, addScan } from './js/growth.js';
import * as ui from './js/ui.js';

/* ---------------------------------------------------------------------------
   ONE experience. No modes, no marker. The tree is placed markerlessly in
   front of you, anchored by gyro so it stays put in space as you look around.
   Pinch to scale, two fingers to move, then lock. A bird orbits the tree,
   perches on top, and — when you look away — flies in front of the camera and
   refuses to leave.
--------------------------------------------------------------------------- */

const EYE_HEIGHT = 1.4;    // metres: how high the phone is held off the floor
const DISTANCE   = 2.0;    // metres in front of you when first placed
const BASE_SCALE = 3.0;    // the tree is authored ~0.6 tall; this sizes it up
const MIN_SCALE  = 1.4;
const MAX_SCALE  = 14.0;
const NEAR_DIST  = 0.6;    // how far in front of the lens the bird nags you from

let phase = 'gate';        // gate -> preview -> adjust -> locked
let treeScale = BASE_SCALE;

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);
addLights(scene);

// The anchored group. Camera sits at the origin and only ever rotates (gyro),
// so anything parented here stays fixed in the room as you turn.
const root = new THREE.Group();
root.scale.setScalar(treeScale);
root.position.set(0, -EYE_HEIGHT, -DISTANCE);
scene.add(root);

// A soft ring on the floor so the placement reads as "on the ground".
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.34, 0.4, 48),
  new THREE.MeshBasicMaterial({ color: 0xEFE6D2, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.001;
root.add(ring);

let tree = null, envelope = null, bird = null;
let scans = 0, treeHeight = 0.4;
const clock = new THREE.Clock();

function rebuild(n) {
  if (tree) { root.remove(tree.group); disposeTree(tree); }
  tree = buildTree(n);
  treeHeight = tree.height;
  root.add(tree.group);

  if (envelope) root.remove(envelope);
  envelope = buildEnvelope();
  envelope.position.copy(tree.envelopeAnchor);
  envelope.position.z += 0.03;
  root.add(envelope);
}

/* ---------- gyro / drag pose (unchanged, it works) ---------- */

let useGyro = false;
let dragYaw = 0, dragPitch = 0;
const devOri = { alpha: 0, beta: 0, gamma: 0 };
const zee = new THREE.Vector3(0, 0, 1);
const eul = new THREE.Euler();
const qa  = new THREE.Quaternion();
const qb  = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function onOrient(e) {
  if (e.alpha === null) return;
  useGyro = true;
  devOri.alpha = THREE.MathUtils.degToRad(e.alpha);
  devOri.beta  = THREE.MathUtils.degToRad(e.beta);
  devOri.gamma = THREE.MathUtils.degToRad(e.gamma);
}

function applyPose() {
  if (useGyro) {
    const orient = THREE.MathUtils.degToRad(screen.orientation?.angle || 0);
    eul.set(devOri.beta, devOri.alpha, -devOri.gamma, 'YXZ');
    camera.quaternion.setFromEuler(eul);
    camera.quaternion.multiply(qb);
    camera.quaternion.multiply(qa.setFromAxisAngle(zee, -orient));
  } else {
    camera.rotation.set(dragPitch, dragYaw, 0, 'YXZ');
  }
}

/* ---------- helpers ---------- */

const _fwd = new THREE.Vector3();
function forwardHoriz() {
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
  return _fwd.normalize();
}
const _right = new THREE.Vector3();
function rightHoriz() {
  _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _right.y = 0;
  if (_right.lengthSq() < 1e-6) _right.set(1, 0, 0);
  return _right.normalize();
}
function lerpAngle(a, b, t) {
  let d = b - a;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  return a + d * t;
}
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ---------- the bird brain ----------
   Two continuous drives, no hard state machine:
     vis   1 when you are looking at the tree, 0 when you have turned away
     perch grows while you keep looking at the tree, so it settles on top
   Target position blends between an orbit around the tree and a fixed point
   right in front of the lens. The bird eases toward that target every frame,
   which is what makes it *chase* you when you spin around. */

const birdState = { vis: 1, perch: 0, prev: new THREE.Vector3() };
const PERCH_DELAY = 5.0;   // seconds of looking before it lands on top

const _treeTop = new THREE.Vector3();
const _orbit   = new THREE.Vector3();
const _perchP  = new THREE.Vector3();
const _treeTgt = new THREE.Vector3();
const _comp    = new THREE.Vector3();
const _target  = new THREE.Vector3();
const _camDir  = new THREE.Vector3();
const _camRight= new THREE.Vector3();
const _camUp   = new THREE.Vector3();

function updateBird(dt, time) {
  if (!bird) return;
  const bs = birdState;
  bird.scale.setScalar(Math.min(treeScale, 6) * 0.7);   // stays a bird even on a giant tree

  root.updateMatrixWorld();

  // Where is the top of the tree, in the room?
  _treeTop.set(0, treeHeight, 0);
  root.localToWorld(_treeTop);

  // How centred is the tree in your view? (camera sits at the origin)
  _camDir.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const toTree = _treeTop.clone().normalize();
  const dot = _camDir.dot(toTree);
  const visTarget = smoothstep(0.62, 0.9, dot);   // 1 looking at it, 0 away
  bs.vis += (visTarget - bs.vis) * (1 - Math.exp(-dt * 6));

  // Perch timer only advances while the tree is squarely in view.
  bs.perch += (bs.vis > 0.82 ? dt : -dt * 2.2);
  bs.perch = Math.max(0, Math.min(PERCH_DELAY, bs.perch));
  const perch = smoothstep(0, PERCH_DELAY, bs.perch);

  // --- target A: around / on top of the tree ---
  const R = (0.18 + treeHeight * 0.5) * treeScale * (1 - perch);
  const spd = bird.userData.variant.speed;
  const ang = time * spd * 0.9;
  const bob = Math.sin(time * 1.6) * 0.05 * treeScale * (1 - perch);
  _orbit.copy(_treeTop);
  _orbit.x += Math.cos(ang) * R;
  _orbit.z += Math.sin(ang) * R * 0.8;
  _orbit.y += bob + 0.04 * treeScale;
  _perchP.copy(_treeTop);
  _perchP.y += 0.03 * treeScale;                  // sits just on the crown
  _treeTgt.copy(_orbit).lerp(_perchP, perch);

  // --- target B: hovering right in front of your face ---
  _comp.copy(_camDir).multiplyScalar(NEAR_DIST);
  _comp.addScaledVector(_camRight, Math.cos(time * 1.7) * 0.13);
  _comp.addScaledVector(_camUp,    Math.sin(time * 2.2) * 0.08);

  // Blend and ease. Slower easing when it is chasing you = it lags, then catches.
  _target.copy(_comp).lerp(_treeTgt, bs.vis);
  const rate = 3.2 + bs.vis * 4.5;
  bs.prev.copy(bird.position);
  bird.position.lerp(_target, 1 - Math.exp(-dt * rate));

  // Face travel near the tree, face *you* when it is nagging you.
  const vx = bird.position.x - bs.prev.x;
  const vz = bird.position.z - bs.prev.z;
  const travelH = (vx * vx + vz * vz > 1e-8) ? Math.atan2(-vz, vx) : bird.rotation.y;
  const camH = Math.atan2(bird.position.z, -bird.position.x); // face the origin (lens)
  bird.rotation.y = lerpAngle(camH, travelH, bs.vis);

  // Wingbeat.
  const flap = Math.sin(time * 9 * spd) * 0.75;
  bird.userData.left.rotation.z  =  Math.PI / 2 - flap;
  bird.userData.right.rotation.z = -Math.PI / 2 + flap;
}

function spawnBird(variant) {
  if (bird) scene.remove(bird);
  bird = buildBird(variant);
  scene.add(bird);
  // Start it out at the tree so it visibly leaves the tree the first time you turn.
  root.updateMatrixWorld();
  _treeTop.set(0, treeHeight, 0);
  root.localToWorld(_treeTop);
  bird.position.copy(_treeTop);
  birdState.vis = 1;
  birdState.perch = 0;
}

/* ---------- render loop ---------- */

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  applyPose();

  if (phase === 'preview') {
    const f = forwardHoriz();
    root.position.set(f.x * DISTANCE, -EYE_HEIGHT, f.z * DISTANCE);
  }

  if (envelope && phase === 'locked') {
    envelope.lookAt(camera.position);
    const r = envelope.userData.ring;
    r.material.opacity = bird ? 0 : 0.28 + Math.sin(t * 2.1) * 0.16;
    r.scale.setScalar(1 + Math.sin(t * 2.1) * 0.06);
  }

  updateBird(dt, t);
  renderer.render(scene, camera);
}

/* ---------- gestures ----------
   one finger  = tap to place / tap the envelope (and drag to look if no gyro)
   two fingers = pinch to scale + drag to move, while adjusting               */

let oneStart = null, oneMoved = false;
let pinch = null;   // { dist, mx, my }

function touchDist(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
function touchMid(a, b) {
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}

addEventListener('touchstart', (e) => {
  if (phase === 'gate' || ui.isLetterOpen()) return;

  if (e.touches.length === 2) {
    if (phase === 'preview') enterAdjust();
    if (phase === 'adjust') {
      const m = touchMid(e.touches[0], e.touches[1]);
      pinch = { dist: touchDist(e.touches[0], e.touches[1]), mx: m.x, my: m.y };
    }
    oneStart = null;
    return;
  }

  const p = e.touches[0];
  oneStart = { x: p.clientX, y: p.clientY };
  oneMoved = false;
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (phase === 'adjust' && pinch && e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];

    // pinch -> scale
    const nd = touchDist(a, b);
    if (pinch.dist > 0) {
      treeScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, treeScale * (nd / pinch.dist)));
      root.scale.setScalar(treeScale);
    }
    pinch.dist = nd;

    // two-finger drag -> move along the floor (sideways + nearer/farther)
    const m = touchMid(a, b);
    const dx = (m.x - pinch.mx) * 0.006;
    const dy = (m.y - pinch.my) * 0.006;
    root.position.addScaledVector(rightHoriz(), dx);
    root.position.addScaledVector(forwardHoriz(), -dy);
    root.position.y = -EYE_HEIGHT;
    pinch.mx = m.x; pinch.my = m.y;
    return;
  }

  if (oneStart && e.touches.length === 1) {
    const p = e.touches[0];
    if (Math.hypot(p.clientX - oneStart.x, p.clientY - oneStart.y) > 10) oneMoved = true;
    if (!useGyro && (phase === 'locked' || phase === 'adjust')) {
      // no gyro (desktop / denied): one-finger drag looks around
      dragYaw   -= (p.clientX - oneStart.x) * 0.005;
      dragPitch -= (p.clientY - oneStart.y) * 0.005;
      dragPitch = Math.max(-1.2, Math.min(1.2, dragPitch));
      oneStart = { x: p.clientX, y: p.clientY };
    }
  }
}, { passive: true });

const ray = new THREE.Raycaster();
const pt  = new THREE.Vector2();

addEventListener('touchend', (e) => {
  if (e.touches.length > 0) return;   // wait for the last finger up
  const wasPinch = !!pinch;
  pinch = null;

  if (phase === 'preview' && oneStart && !oneMoved) { enterAdjust(); oneStart = null; return; }

  if (phase === 'locked' && oneStart && !oneMoved && !wasPinch) tryEnvelope(e);
  oneStart = null;
}, { passive: true });

// desktop click = place, then tap envelope
addEventListener('click', (e) => {
  if (phase === 'preview') { enterAdjust(); return; }
  if (phase === 'locked') tryEnvelope(e);
});

function tryEnvelope(ev) {
  if (!envelope || ui.isLetterOpen()) return;
  const p = ev.changedTouches ? ev.changedTouches[0] : ev;
  pt.x =  (p.clientX / innerWidth)  * 2 - 1;
  pt.y = -(p.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(pt, camera);
  if (!ray.intersectObject(envelope.userData.hit, true).length) return;
  ui.openLetter(ui.letterFor(scans), () => ui.status('Folded away. The bird stays.', true));
}

/* ---------- phase transitions ---------- */

function enterAdjust() {
  phase = 'adjust';
  document.getElementById('place-hint').hidden = true;
  document.getElementById('adjust-bar').hidden = false;
  document.getElementById('move-btn').hidden = true;
  if (!bird) spawnBird(scans % 4);
  ui.status('');
}

function lockInPlace() {
  phase = 'locked';
  document.getElementById('adjust-bar').hidden = true;
  document.getElementById('move-btn').hidden = false;
  ring.visible = false;
  ui.status('Locked. Look around it — then look away and see who follows.', true);
}

document.getElementById('lock-btn').addEventListener('click', (e) => { e.stopPropagation(); lockInPlace(); });
document.getElementById('move-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  ring.visible = true;
  enterAdjust();
});

/* ---------- start ---------- */

async function begin() {
  document.getElementById('gate').classList.add('hidden');
  phase = 'preview';
  document.getElementById('place-hint').hidden = false;

  if (typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === 'granted') addEventListener('deviceorientation', onOrient);
    } catch { /* fall through to drag */ }
  } else {
    addEventListener('deviceorientation', onOrient);
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false,
    });
    const v = document.getElementById('feed');
    v.srcObject = stream;
    await v.play();
  } catch {
    ui.status('Camera blocked. The tree still renders, on black.');
  }

  scans = await addScan();
  ui.renderCount(scans);
  rebuild(scans);
  renderer.setAnimationLoop(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('letter-close').addEventListener('click', ui.closeLetter);
document.getElementById('begin').addEventListener('click', begin, { once: true });

ui.initDev((n) => { scans = n; rebuild(n); });
getScans().then(ui.renderCount);
</script>
</body>
</html>
