<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Growing tree · AR</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<video id="feed" playsinline muted autoplay></video>
<div id="stage"></div>

<div id="hud">
  <span id="count">0</span>
  <span id="count-label">scans</span>
</div>
<button id="lock-toggle" hidden>Lock</button>
<div id="status"></div>

<!-- the bird's card: appears only when the bird is in front of the lens -->
<div id="bird-card" hidden>
  <div class="bird-name" id="bird-name">Bird</div>
  <div class="bird-note" id="bird-note"></div>
  <div class="bird-stats">
    <div class="stat"><b id="bird-steps">0</b><span>steps</span></div>
    <div class="stat"><b id="bird-dist">0 m</b><span>distance covered</span></div>
  </div>
</div>

<!-- placement + edit controls: only while facing the tree -->
<div id="place-hint" hidden>Tap where the tree should stand</div>
<div id="edit-bar" hidden>
  <span class="adjust-tip">Drag the tree with one finger · slider to resize</span>
  <label class="size-row">
    <span>Size</span>
    <input type="range" id="size-slider" min="1.4" max="14" step="0.1" value="3">
  </label>
</div>

<div id="gate">
  <h1 class="mark">A tree that <em>grows</em> when you look</h1>
  <p>Set the tree down in the room, size it, and lock it. Then walk up to it, around it, and let the bird find you.</p>
  <button class="primary" id="begin">Allow camera and begin</button>
</div>

<div id="letter-scrim">
  <div id="letter">
    <div class="crease"></div>
    <h2 id="letter-title"></h2>
    <div class="body" id="letter-body"></div>
    <div class="sign" id="letter-from"></div>
    <button id="letter-close">Fold it back</button>
  </div>
</div>

<div id="dev">
  <label id="dev-read">0 scans</label>
  <input type="range" id="dev-slider" min="0" max="400" value="0">
  <div class="row">
    <button id="dev-reset">Reset to seed</button>
    <button id="dev-close">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildTree, buildEnvelope, buildBird, addLights, disposeTree, BIRD_VARIANTS } from './js/scene.js';
import { getScans, addScan } from './js/growth.js';
import * as ui from './js/ui.js';

/* ---------------------------------------------------------------------------
   ONE experience. Place the tree, size it, lock it. Then WALK: each footfall
   the accelerometer detects moves the tree along the way you are facing, so
   stepping toward it makes it loom and stepping around it shows its far side.
   (iOS Safari has no true positional tracking; this is step dead-reckoning.)
   A low-poly bird orbits the tree, perches, and — when you look away — flies
   in front of the lens at a comfortable size with a card of who it is and how
   far you have walked together.
--------------------------------------------------------------------------- */

const EYE_HEIGHT = 1.4;
const DISTANCE   = 2.0;
const BASE_SCALE = 3.0;
const MIN_SCALE  = 1.4;
const MAX_SCALE  = 14.0;
const FOV        = 70;
const NEAR_DIST  = 1.2;      // how far in front of the lens the bird flies
const COMPANION_FRAC = 0.30; // fraction of screen height the bird fills up close
const BIRD_H     = 0.30;     // the bird's normalised height at scale 1
const STRIDE     = 0.72;     // metres walked per detected step (for the counter)
const MOVE_STRIDE = 0.60;    // metres the tree shifts per step

const BIRD_MODEL_URL = 'models/bird_hover_loop.glb';
const BIRD_YAW_OFFSET = Math.PI;   // rotate the model so its beak points +x

const visH = 2 * NEAR_DIST * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const COMPANION_SCALE = (COMPANION_FRAC * visH) / BIRD_H;

let phase = 'gate';          // gate -> preview -> edit -> locked
let treeScale = BASE_SCALE;

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);
addLights(scene);

// A soft studio environment so the model's PBR materials read nicely.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Camera stays at the origin and only rotates; walking moves this instead.
const root = new THREE.Group();
root.scale.setScalar(treeScale);
root.position.set(0, -EYE_HEIGHT, -DISTANCE);
scene.add(root);
const rootTarget = new THREE.Vector3().copy(root.position);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.34, 0.4, 48),
  new THREE.MeshBasicMaterial({ color: 0xEFE6D2, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.001;
root.add(ring);

let tree = null, envelopes = [], bird = null;
let scans = 0, treeHeight = 0.4;
const clock = new THREE.Clock();

/* ---------- the hummingbird model ----------
   A rigged, animated glTF. It loads asynchronously; until it arrives (or if it
   fails) the hand-built low-poly bird stands in, so the piece never breaks. */

let birdModel = null;    // the prepared, normalised model group (reused, one instance)
let birdMixer = null;    // plays its baked hover/flap animation

// The meshes are skinned, so their geometry bounding box is bind-pose garbage.
// The skeleton's bone positions are the only honest measure of where the bird
// actually is and how big it renders.
function boneBox(obj) {
  obj.updateMatrixWorld(true);
  let skel = null;
  obj.traverse((o) => { if (o.isSkinnedMesh && o.skeleton) skel = o.skeleton; });
  const box = new THREE.Box3();
  if (skel) {
    const v = new THREE.Vector3();
    skel.bones.forEach((b) => { v.setFromMatrixPosition(b.matrixWorld); box.expandByPoint(v); });
  } else {
    box.setFromObject(obj);
  }
  return box;
}

new GLTFLoader().load(BIRD_MODEL_URL, (gltf) => {
  const inner = gltf.scene;
  const orient = new THREE.Group();
  orient.add(inner);
  birdModel = new THREE.Group();
  birdModel.add(orient);

  // scale so the bird's largest span is BIRD_H, then re-centre on the skeleton
  const size = boneBox(birdModel).getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  orient.scale.setScalar(BIRD_H / maxDim);
  orient.rotation.y = BIRD_YAW_OFFSET;
  const c = boneBox(birdModel).getCenter(new THREE.Vector3());
  orient.position.sub(c);

  birdModel.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; o.castShadow = false; } });

  if (gltf.animations && gltf.animations.length) {
    birdMixer = new THREE.AnimationMixer(inner);
    birdMixer.clipAction(gltf.animations[0]).play();
  }

  // if a placeholder bird is already flying, upgrade to the real one in place
  if (bird && !bird.userData.isModel) {
    const keep = bird.position.clone();
    const variant = bird.userData.variant;
    scene.remove(bird);
    bird = birdModel;
    bird.userData = { variant, isModel: true, phase: 0 };
    bird.position.copy(keep);
    scene.add(bird);
  }
}, undefined, (err) => {
  console.warn('bird model failed to load, keeping the low-poly bird', err);
});

function rebuild(n) {
  if (tree) { root.remove(tree.group); disposeTree(tree); }
  tree = buildTree(n);
  treeHeight = tree.height;
  root.add(tree.group);

  // three envelopes on three branches, each holding a different letter
  envelopes.forEach((e) => root.remove(e));
  envelopes = [];
  const sorted = [...tree.tips].sort((a, b) => a.pos.y - b.pos.y);
  const picks = sorted.length >= 3
    ? [0.35, 0.6, 0.82].map((f) => sorted[Math.floor(sorted.length * f)])
    : sorted;
  picks.forEach((tip, i) => {
    const env = buildEnvelope();
    env.position.copy(tip.pos);
    env.position.z += 0.03;
    env.userData.letterIndex = i;
    env.userData.opened = false;
    root.add(env);
    envelopes.push(env);
  });
}

/* ---------- gyro / drag pose ---------- */

let useGyro = false;
let dragYaw = 0, dragPitch = 0;
const devOri = { alpha: 0, beta: 0, gamma: 0 };
const zee = new THREE.Vector3(0, 0, 1);
const eul = new THREE.Euler();
const qa  = new THREE.Quaternion();
const qb  = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function onOrient(e) {
  if (e.alpha === null) return;
  useGyro = true;
  devOri.alpha = THREE.MathUtils.degToRad(e.alpha);
  devOri.beta  = THREE.MathUtils.degToRad(e.beta);
  devOri.gamma = THREE.MathUtils.degToRad(e.gamma);
}

function applyPose() {
  if (useGyro) {
    const orient = THREE.MathUtils.degToRad(screen.orientation?.angle || 0);
    eul.set(devOri.beta, devOri.alpha, -devOri.gamma, 'YXZ');
    camera.quaternion.setFromEuler(eul);
    camera.quaternion.multiply(qb);
    camera.quaternion.multiply(qa.setFromAxisAngle(zee, -orient));
  } else {
    camera.rotation.set(dragPitch, dragYaw, 0, 'YXZ');
  }
}

/* ---------- pedometer -> distance + walking the tree ---------- */

let steps = 0, grav = 9.8, stepArmed = true, lastStepAt = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a) return;
  const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  grav += (mag - grav) * 0.08;
  const dyn = mag - grav;
  const now = performance.now();
  if (dyn > 2.2 && stepArmed && now - lastStepAt > 300) {
    steps++; stepArmed = false; lastStepAt = now;
    if (phase === 'locked') {
      // stepping forward carries the tree toward (and past) you
      const f = forwardHoriz();
      rootTarget.addScaledVector(f, -MOVE_STRIDE);
      rootTarget.y = -EYE_HEIGHT;
      const d = Math.hypot(rootTarget.x, rootTarget.z);
      if (d > 0.001) {
        const c = Math.min(18, Math.max(0.5, d)) / d;   // keep it findable
        rootTarget.x *= c; rootTarget.z *= c;
      }
    }
  }
  if (dyn < 0.6) stepArmed = true;
}

/* ---------- helpers ---------- */

const _fwd = new THREE.Vector3();
function forwardHoriz() {
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
  return _fwd.normalize();
}
const _right = new THREE.Vector3();
function rightHoriz() {
  _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _right.y = 0;
  if (_right.lengthSq() < 1e-6) _right.set(1, 0, 0);
  return _right.normalize();
}
function lerpAngle(a, b, t) {
  let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d));
  return a + d * t;
}
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ---------- the bird brain ---------- */

const birdState = { vis: 1, perch: 0, prev: new THREE.Vector3(), card: false };
const PERCH_DELAY = 5.0;

const _treeTop = new THREE.Vector3();
const _orbit   = new THREE.Vector3();
const _perchP  = new THREE.Vector3();
const _treeTgt = new THREE.Vector3();
const _comp    = new THREE.Vector3();
const _target  = new THREE.Vector3();
const _camDir  = new THREE.Vector3();
const _camRight= new THREE.Vector3();
const _camUp   = new THREE.Vector3();

function updateBird(dt, time) {
  if (!bird) return;
  const bs = birdState;

  root.updateMatrixWorld();
  _treeTop.set(0, treeHeight, 0);
  root.localToWorld(_treeTop);

  _camDir.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const dot = _camDir.dot(_treeTop.clone().normalize());
  const visTarget = smoothstep(0.62, 0.9, dot);
  bs.vis += (visTarget - bs.vis) * (1 - Math.exp(-dt * 6));

  bs.perch += (bs.vis > 0.82 ? dt : -dt * 2.2);
  bs.perch = Math.max(0, Math.min(PERCH_DELAY, bs.perch));
  const perch = smoothstep(0, PERCH_DELAY, bs.perch);

  const R = (0.18 + treeHeight * 0.5) * treeScale * (1 - perch);
  const spd = bird.userData.variant.speed;
  const ang = time * spd * 0.9;
  const bob = Math.sin(time * 1.6) * 0.05 * treeScale * (1 - perch);
  _orbit.copy(_treeTop);
  _orbit.x += Math.cos(ang) * R;
  _orbit.z += Math.sin(ang) * R * 0.8;
  _orbit.y += bob + 0.04 * treeScale;
  _perchP.copy(_treeTop); _perchP.y += 0.05 * treeScale;
  _treeTgt.copy(_orbit).lerp(_perchP, perch);

  _comp.copy(_camDir).multiplyScalar(NEAR_DIST);
  _comp.addScaledVector(_camRight, Math.cos(time * 1.6) * 0.14);
  _comp.addScaledVector(_camUp,    Math.sin(time * 2.1) * 0.09 - 0.05);

  _target.copy(_comp).lerp(_treeTgt, bs.vis);
  const rate = 3.2 + bs.vis * 4.5;
  bs.prev.copy(bird.position);
  bird.position.lerp(_target, 1 - Math.exp(-dt * rate));

  const treeBird = Math.min(treeScale, 7) * 0.28;
  bird.scale.setScalar(COMPANION_SCALE + (treeBird - COMPANION_SCALE) * bs.vis);

  const vx = bird.position.x - bs.prev.x;
  const vz = bird.position.z - bs.prev.z;
  const travelH = (vx * vx + vz * vz > 1e-8) ? Math.atan2(-vz, vx) : bird.rotation.y;
  const camH = Math.atan2(bird.position.z, -bird.position.x);
  bird.rotation.y = lerpAngle(camH, travelH, bs.vis);

  // the low-poly fallback flaps in code; the model flaps via its own animation
  if (!bird.userData.isModel) {
    const amp = 0.35 + 0.8 * (1 - perch);
    const beat = Math.sin(time * spd * 8 + bird.userData.phase) * 0.5 + 0.5;
    const up = 0.12 + beat * amp;
    bird.userData.rightWing.rotation.x = -up;
    bird.userData.leftWing.rotation.x  =  up;
  }

  const showCard = bs.vis < 0.5;
  if (showCard !== bs.card) {
    bs.card = showCard;
    document.getElementById('bird-card').hidden = !showCard;
  }
  if (showCard) {
    document.getElementById('bird-steps').textContent = steps;
    document.getElementById('bird-dist').textContent = (steps * STRIDE).toFixed(1) + ' m';
  }
}

function spawnBird(variant) {
  const v = BIRD_VARIANTS[variant % BIRD_VARIANTS.length];
  if (bird) scene.remove(bird);
  if (birdModel) {
    bird = birdModel;
    bird.userData = { variant: v, isModel: true, phase: 0 };
  } else {
    bird = buildBird(variant);
  }
  scene.add(bird);
  root.updateMatrixWorld();
  _treeTop.set(0, treeHeight, 0);
  root.localToWorld(_treeTop);
  bird.position.copy(_treeTop);
  birdState.vis = 1; birdState.perch = 0;
  document.getElementById('bird-name').textContent = v.name;
  document.getElementById('bird-note').textContent = v.note;
}

/* ---------- render loop ---------- */

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  applyPose();

  if (phase === 'preview') {
    const f = forwardHoriz();
    root.position.set(f.x * DISTANCE, -EYE_HEIGHT, f.z * DISTANCE);
    rootTarget.copy(root.position);
  } else if (phase === 'locked') {
    root.position.lerp(rootTarget, 1 - Math.exp(-dt * 6));
    root.position.y = -EYE_HEIGHT;
  }

  if (phase === 'locked') {
    for (const env of envelopes) {
      env.lookAt(camera.position);
      const r = env.userData.ring;
      r.material.opacity = env.userData.opened ? 0
        : 0.24 + Math.sin(t * 2.1 + env.userData.letterIndex * 1.3) * 0.16;
      r.scale.setScalar(1 + Math.sin(t * 2.1) * 0.06);
    }
  }

  updateBird(dt, t);
  if (birdMixer) birdMixer.update(dt * (0.9 + birdState.vis * 0.3));

  // the size controls belong to the tree: only while you are facing it
  if (phase === 'edit') {
    document.getElementById('edit-bar').hidden = birdState.vis < 0.5;
  }

  renderer.render(scene, camera);
}

/* ---------- gestures: one finger only ---------- */

let oneStart = null, oneMoved = false;

function onControl(target) {
  return !!(target.closest && target.closest(
    '#edit-bar,#hud,#bird-card,#dev,#gate,#letter-scrim,#lock-toggle,button,input,a'));
}

addEventListener('touchstart', (e) => {
  if (phase === 'gate' || ui.isLetterOpen() || onControl(e.target)) { oneStart = null; return; }
  const p = e.touches[0];
  oneStart = { x: p.clientX, y: p.clientY };
  oneMoved = false;
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (!oneStart || e.touches.length !== 1) return;
  const p = e.touches[0];
  const dx = p.clientX - oneStart.x;
  const dy = p.clientY - oneStart.y;
  if (Math.hypot(dx, dy) > 8) oneMoved = true;

  if (phase === 'edit' && useGyro) {
    root.position.addScaledVector(rightHoriz(), dx * 0.006);
    root.position.addScaledVector(forwardHoriz(), -dy * 0.006);
    root.position.y = -EYE_HEIGHT;
    rootTarget.copy(root.position);
  } else if (!useGyro) {
    dragYaw   -= dx * 0.005;
    dragPitch -= dy * 0.005;
    dragPitch = Math.max(-1.2, Math.min(1.2, dragPitch));
  }
  oneStart = { x: p.clientX, y: p.clientY };
}, { passive: true });

const ray = new THREE.Raycaster();
const pt  = new THREE.Vector2();

addEventListener('touchend', (e) => {
  if (e.touches.length > 0) return;
  if (phase === 'preview' && oneStart && !oneMoved) { enterEdit(); oneStart = null; return; }
  if (phase === 'locked' && oneStart && !oneMoved) tryEnvelope(e);
  oneStart = null;
}, { passive: true });

addEventListener('click', (e) => {
  if (onControl(e.target)) return;
  if (phase === 'preview') { enterEdit(); return; }
  if (phase === 'locked') tryEnvelope(e);
});

function tryEnvelope(ev) {
  if (!envelopes.length || ui.isLetterOpen()) return;
  const p = ev.changedTouches ? ev.changedTouches[0] : ev;
  pt.x =  (p.clientX / innerWidth)  * 2 - 1;
  pt.y = -(p.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(pt, camera);
  for (const env of envelopes) {
    if (ray.intersectObject(env.userData.hit, true).length) {
      ui.openLetter(ui.LETTERS[env.userData.letterIndex % ui.LETTERS.length], () => {
        env.userData.opened = true;
        ui.status('Folded away.', true);
      });
      return;
    }
  }
}

/* ---------- stop iOS from zooming the page ---------- */

['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let lastEnd = 0;
document.addEventListener('touchend', (e) => {
  const n = Date.now();
  if (n - lastEnd < 350) e.preventDefault();
  lastEnd = n;
}, { passive: false });

/* ---------- phase transitions ---------- */

const lockToggle = document.getElementById('lock-toggle');

function enterEdit() {
  phase = 'edit';
  document.getElementById('place-hint').hidden = true;
  document.getElementById('edit-bar').hidden = false;
  ring.visible = true;
  lockToggle.hidden = false;
  lockToggle.textContent = 'Lock';
  document.getElementById('size-slider').value = treeScale;
  rootTarget.copy(root.position);
  if (!bird) spawnBird(scans % 4);
  ui.status('');
}

function lockInPlace() {
  phase = 'locked';
  document.getElementById('edit-bar').hidden = true;
  ring.visible = false;
  lockToggle.textContent = 'Unlock';
  rootTarget.copy(root.position);
  ui.status('Locked. Walk up to it, around it — and look away to meet the bird.', true);
}

lockToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  if (phase === 'locked') enterEdit(); else lockInPlace();
});

document.getElementById('size-slider').addEventListener('input', (e) => {
  treeScale = parseFloat(e.target.value);
  root.scale.setScalar(treeScale);
});

/* ---------- start ---------- */

async function askPermission(EventClass) {
  if (typeof EventClass !== 'undefined' && typeof EventClass.requestPermission === 'function') {
    try { return (await EventClass.requestPermission()) === 'granted'; }
    catch { return false; }
  }
  return true;
}

async function begin() {
  document.getElementById('gate').classList.add('hidden');
  phase = 'preview';
  document.getElementById('place-hint').hidden = false;

  if (await askPermission(window.DeviceOrientationEvent)) addEventListener('deviceorientation', onOrient);
  if (await askPermission(window.DeviceMotionEvent))       addEventListener('devicemotion', onMotion);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false,
    });
    const v = document.getElementById('feed');
    v.srcObject = stream;
    await v.play();
  } catch {
    ui.status('Camera blocked. The tree still renders, on black.');
  }

  scans = await addScan();
  ui.renderCount(scans);
  rebuild(scans);
  renderer.setAnimationLoop(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('letter-close').addEventListener('click', ui.closeLetter);
document.getElementById('begin').addEventListener('click', begin, { once: true });

ui.initDev((n) => { scans = n; rebuild(n); });
getScans().then(ui.renderCount);
</script>
</body>
</html>
